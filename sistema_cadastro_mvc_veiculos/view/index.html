<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>Cadastro de veículos</title>
    </head>

    <body>
        <h1>Cadastro de veículos</h1>

        <form action="../controller/controller.php" method="POST">

            <label>Placa:</label><br/>
            <input type="text" name="placa" id="placa" placeholder="Somente letras maiúsculas" required>

            <br/><br/>

            <label>Marca:</label><br/>
            <input type="text" name="marca" id="marca" placeholder="Marca do carro" required>

            <br/><br/>

            <label>Modelo:</label><br/>
            <input type="text" name="modelo" id="modelo" placeholder="Modelo do carro" required>

            <br/><br/>

            <label>Cor:</label><br/>
            <input type="text" name="cor" id="cor" placeholder="Cor do veículo" required>

            <br/><br/>

            <label>Ano:</label><br/>
            <input type="number" name="ano" id="ano" placeholder="Apenas Ano" required>

            <br/><br/>

            <label>Porte:</label><br/>
            <input type="text" name="porte" id="porte" placeholder="Porte..." required>

            <br/><br/>

            <label>Tipo de carga:</label><br/>
            <input type="text" name="tipocarga" id="tipocarga" placeholder="Tipo de carga..." required>

            <br/><br/>

            <label>Chassis:</label><br/>
            <input type="text" name="chassis" id="chassis" placeholder="Chassis..." required>

            <br/><br/>

            <input type="submit" value="Cadastrar!">

        </form>
    </body>
</html>
